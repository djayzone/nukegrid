name: Bug report
description: Report something that is broken
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve NukeGrid.
        Merci de contribuer à l'amélioration de NukeGrid.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the game...
        2. Open...
        3. Perform...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running NukeGrid?
      options:
        - Docker Compose
        - Docker
        - Kubernetes
        - Local Node.js
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: main, tag, or commit SHA
