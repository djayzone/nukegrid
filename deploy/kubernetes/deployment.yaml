apiVersion: v1
kind: Namespace
metadata:
  name: nukegrid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nukegrid
  namespace: nukegrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nukegrid
  template:
    metadata:
      labels:
        app: nukegrid
    spec:
      containers:
        - name: nukegrid
          image: nukegrid:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4176
          env:
            - name: NUKEGRID_HOST
              value: 0.0.0.0
            - name: NUKEGRID_PORT
              value: "4176"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nukegrid
  namespace: nukegrid
spec:
  selector:
    app: nukegrid
  ports:
    - name: http
      port: 4176
      targetPort: http
